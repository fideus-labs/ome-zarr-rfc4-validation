rfc4:
  version: 0.2.0
  spec: https://ngff.openmicroscopy.org/rfc/4
  pr: https://github.com/ome/ngff/pull/528
canonical_output_contract:
  description: A conformant tool, given one input, emits this JSON.
  fields:
    input: path to the dataset
    format: ome-zarr | nifti | dicom | nrrd
    rfc4_valid: bool (ome-zarr schema cases only; null for derived formats)
    axes: list of {name, type, orientation-value|null}
    violations: list of {code, axis, message} (empty when valid)
    warnings: list of {code, message}
requirements:
  R1:
    level: MUST
    text: orientation only on axes with type 'space' (never time/channel)
  R2:
    level: MUST
    text: orientation is an object with both 'type' and 'value'
  R3:
    level: MUST
    text: orientation.type is 'anatomical'
  R4:
    level: MUST
    text: orientation.value is one of the 24 controlled-vocabulary terms
  R5:
    level: MUST
    text: at most one direction per anatomical axis (no antonym-pair collision)
  R6:
    level: SHOULD
    text: writers omit the field rather than serialize null (null == absent)
  R7:
    level: DEF
    text: value names the lowest->highest coordinate direction (flip semantics)
  R8:
    level: SHOULD
    text: subject roughly aligned to imaging axes (oblique -> warn)
  R9:
    level: COVER
    text: full vocabulary incl. subject-local (PR#528) and quadruped terms
  R10:
    level: DERIVE
    text: correct RFC-4 derivation from DICOM IOP / NIfTI affine / NRRD space directions
cases:
- id: TC-49
  title: Real ICBM152 brain, RAS (standard A/P + I/S)
  format: ome-zarr
  input: ./ome-zarr/brain_icbm_ras.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real ICBM152 T1 -> OME-Zarr with orientation WRITTEN; the OME-Zarr carrier of the standard
    posterior-to-anterior + inferior-to-superior terms.
  expected:
    rfc4_valid: true
    axes:
      z: inferior-to-superior
      y: posterior-to-anterior
      x: left-to-right
    violations: []
- id: TC-50
  title: Real ICBM152 brain, flipped (A/P + S/I)
  format: ome-zarr
  input: ./ome-zarr/brain_icbm_ras_flip.ome.zarr
  requirements:
  - R7
  - R9
  expect: valid
  rationale: exact flip of TC-49 (same real brain); adds anterior-to-posterior + superior-to-inferior
    in written OME-Zarr metadata.
  expected:
    rfc4_valid: true
    axes:
      z: superior-to-inferior
      y: anterior-to-posterior
      x: right-to-left
    violations: []
- id: TC-C
  title: Invalid vocabulary 'LPS'
  format: ome-zarr
  input: ./ome-zarr/TC-C_invalid_vocabulary.ome.zarr
  requirements:
  - R4
  expect: invalid
  rationale: '''LPS'' shorthand is not a vocabulary term; MUST be rejected.'
  expected:
    rfc4_valid: false
    violations:
    - bad-value
- id: TC-D
  title: Orientation on time axis
  format: ome-zarr
  input: ./ome-zarr/TC-D_orientation_on_time_axis.ome.zarr
  requirements:
  - R1
  expect: invalid
  rationale: orientation on a type:time axis is forbidden; MUST be rejected.
  expected:
    rfc4_valid: false
    violations:
    - orientation-on-non-space
- id: SC-03
  title: Orientation on channel axis
  format: ome-zarr
  input: conformance/cases/SC-03_channel_orientation.ome.zarr
  requirements:
  - R1
  expect: invalid
  rationale: type:channel variant of the non-space rule; isolates the single violation.
  expected:
    rfc4_valid: false
    violations:
    - orientation-on-non-space
- id: SC-05
  title: Missing orientation value
  format: ome-zarr
  input: conformance/cases/SC-05_missing_value.ome.zarr
  requirements:
  - R2
  expect: invalid
  rationale: orientation without 'value' violates the required-fields rule.
  expected:
    rfc4_valid: false
    violations:
    - missing-value
- id: SC-06
  title: Bad orientation type
  format: ome-zarr
  input: conformance/cases/SC-06_bad_type.ome.zarr
  requirements:
  - R3
  expect: invalid
  rationale: orientation.type 'geographical' is not 'anatomical'.
  expected:
    rfc4_valid: false
    violations:
    - bad-type
- id: SC-07
  title: Duplicate anatomical axis
  format: ome-zarr
  input: conformance/cases/SC-07_duplicate_pair.ome.zarr
  requirements:
  - R5
  expect: invalid
  rationale: two axes on the left-to-right/right-to-left axis; only one allowed.
  expected:
    rfc4_valid: false
    violations:
    - duplicate-anatomical-axis
- id: SC-01
  title: Quadruped vocabulary
  format: ome-zarr
  input: conformance/cases/SC-01_quadruped_valid.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: quadruped terms (dorsal-to-ventral, rostral-to-caudal) MUST be accepted.
  expected:
    rfc4_valid: true
    axes:
      z: dorsal-to-ventral
      y: rostral-to-caudal
      x: left-to-right
    violations: []
- id: SC-02
  title: Null orientation
  format: ome-zarr
  input: conformance/cases/SC-02_null_orientation.ome.zarr
  requirements:
  - R6
  expect: valid
  rationale: orientation:null == absent; valid, but a SHOULD-omit warning is emitted.
  expected:
    rfc4_valid: true
    warnings:
    - null-orientation
    violations: []
- id: TC-05
  title: DICOM HFDR
  format: dicom
  input: ./dicom/TC-05_HFDR.dcm
  requirements:
  - R10
  expect: valid
  rationale: derive orientation from IOP=[0,-1,0,1,0,0]; PatientPosition ignored.
  expected:
    axes:
      x: posterior-to-anterior
      y: right-to-left
      z: inferior-to-superior
- id: TC-06
  title: DICOM HFDL
  format: dicom
  input: ./dicom/TC-06_HFDL.dcm
  requirements:
  - R10
  - R7
  expect: valid
  rationale: mirror of TC-05 (L/R flip in the IOP derivation).
  expected:
    axes:
      x: anterior-to-posterior
      y: left-to-right
      z: inferior-to-superior
- id: TC-11
  title: NIfTI qform!=sform
  format: nifti
  input: ./nifti/TC-11_qform_sform_mismatch.nii.gz
  requirements:
  - R10
  expect: valid
  rationale: qform/sform ambiguity; a tool must document which transform it uses.
  expected:
    axes:
      i: right-to-left
      j: posterior-to-anterior
      k: inferior-to-superior
- id: TC-08
  title: MNI avg152 LR (LAS)
  format: nifti
  input: ./nifti/avg152T1_LR_nifti.nii.gz
  requirements:
  - R10
  - R7
  expect: valid
  rationale: real reference; neurological LAS. Flip pair with TC-09.
  expected:
    axes:
      i: right-to-left
      j: posterior-to-anterior
      k: inferior-to-superior
- id: TC-09
  title: MNI avg152 RL (RAS)
  format: nifti
  input: ./nifti/avg152T1_RL_nifti.nii.gz
  requirements:
  - R10
  - R7
  expect: valid
  rationale: real reference; radiological RAS. Proves L/R flip detection vs TC-08.
  expected:
    axes:
      i: left-to-right
      j: posterior-to-anterior
      k: inferior-to-superior
- id: TC-23
  title: Canon axial DTI (dcm_qa_canon_61)
  format: nifti
  input: ./nifti/TC-23_canon_DTI_axial.nii.gz
  requirements:
  - R10
  expect: valid
  rationale: real Canon 3T DTI, axial strict (0deg off-axis); clean LAS derivation (BSD-2).
  expected:
    axes:
      i: right-to-left
      j: posterior-to-anterior
      k: inferior-to-superior
- id: TC-13
  title: NRRD MRHead (LPS rotated)
  format: nrrd
  input: ./nrrd/MRHead.nrrd
  requirements:
  - R10
  - R8
  expect: valid
  rationale: real NRRD, LPS with non-identity space directions; stresses dominant-axis derivation.
  expected:
    axes:
      '0': anterior-to-posterior
      '1': superior-to-inferior
      '2': left-to-right
- id: TC-26
  title: MINC ICBM152 T1
  format: minc
  input: ./minc/mni_icbm152_t1.mnc
  requirements:
  - R10
  expect: valid
  rationale: real MNI ICBM152 brain (MINC2); nibabel derives i/j/k from the direction cosines.
  expected:
    axes:
      i: inferior-to-superior
      j: posterior-to-anterior
      k: left-to-right
- id: TC-27
  title: MINC ICBM152 z-flip
  format: minc
  input: ./minc/icbm152_t1_2mm_zflip.mnc
  requirements:
  - R7
  - R10
  expect: valid
  rationale: exact z-flip of TC-26; isolates superior-to-inferior on i.
  expected:
    axes:
      i: superior-to-inferior
      j: posterior-to-anterior
      k: left-to-right
- id: TC-28
  title: MINC ICBM152 xy-flip
  format: minc
  input: ./minc/icbm152_t1_2mm_xyflip.mnc
  requirements:
  - R7
  - R10
  expect: valid
  rationale: exact x+y flip of TC-26; adds right-to-left + anterior-to-posterior.
  expected:
    axes:
      i: inferior-to-superior
      j: anterior-to-posterior
      k: right-to-left
- id: TC-30
  title: Analyze avg152T1
  format: analyze
  input: ./analyze/avg152T1.hdr
  requirements:
  - R10
  expect: valid
  rationale: real SPM avg152T1 (Analyze 7.5); nibabel derives LAS from pixdim signs (ambiguous format).
  expected:
    axes:
      i: right-to-left
      j: posterior-to-anterior
      k: inferior-to-superior
- id: TC-21
  title: Real Allen mouse (quadruped)
  format: ome-zarr
  input: ./ome-zarr/mouse_allen_quadruped.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real mouse brain; quadruped terms written into OME-Zarr (from atlas 'asr').
  expected:
    rfc4_valid: true
    axes:
      z: rostral-to-caudal
      y: dorsal-to-ventral
      x: right-to-left
    violations: []
- id: TC-22
  title: Real foot CT (limb)
  format: ome-zarr
  input: ./ome-zarr/foot_cmb_limb.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real foot; limb terms written into OME-Zarr; proximal-distal verified by bone mass.
  expected:
    rfc4_valid: true
    axes:
      z: distal-to-proximal
      y: dorsal-to-plantar
    violations: []
- id: TC-24
  title: Real skin superficial-to-deep (Janelia)
  format: ome-zarr
  input: ./ome-zarr/skin_janelia_superficial_deep.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real mouse skin FIB-SEM (jrc_mus-skin-1, CC BY 4.0); subject-local depth term on real data.
  expected:
    rfc4_valid: true
    axes:
      z: superficial-to-deep
    violations: []
- id: TC-25
  title: Real heart apex-to-base (Janelia)
  format: ome-zarr
  input: ./ome-zarr/heart_janelia_apex_base.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real mouse heart FIB-SEM (jrc_mus-heart-1, CC BY 4.0); subject-local cardiac term on real
    data.
  expected:
    rfc4_valid: true
    axes:
      z: apex-to-base
    violations: []
- id: TC-44
  title: Real airway epithelium (apical-to-basal)
  format: ome-zarr
  input: ./ome-zarr/airway_epithelium.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real polarized epithelium FIB-SEM; apical surface marked by cilia (definitive). Real apical-to-basal.
  expected:
    rfc4_valid: true
    axes:
      z: apical-to-basal
    violations: []
- id: TC-46
  title: Real whole-body mouse uCT (caudal-to-cranial)
  format: ome-zarr
  input: ./ome-zarr/mouse_rosenhain_wholebody.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real whole-body mouse micro-CT (Rosenhain, CC0); skull verified at the cranial end.
  expected:
    rfc4_valid: true
    axes:
      z: caudal-to-cranial
      y: dorsal-to-ventral
    violations: []
- id: TC-39
  title: Allen mouse, flipped (reverse quadruped)
  format: ome-zarr
  input: ./ome-zarr/mouse_allen_quadruped_flip.ome.zarr
  requirements:
  - R7
  - R9
  expect: valid
  rationale: exact flip of TC-21; covers caudal-to-rostral + ventral-to-dorsal on real data.
  expected:
    rfc4_valid: true
    axes:
      z: caudal-to-rostral
      y: ventral-to-dorsal
      x: left-to-right
    violations: []
- id: TC-40
  title: Foot CT, flipped (reverse limb)
  format: ome-zarr
  input: ./ome-zarr/foot_cmb_limb_flip.ome.zarr
  requirements:
  - R7
  - R9
  expect: valid
  rationale: exact flip of TC-22; covers proximal-to-distal + plantar-to-dorsal.
  expected:
    rfc4_valid: true
    axes:
      z: proximal-to-distal
      y: plantar-to-dorsal
    violations: []
- id: TC-41
  title: Skin EM, flipped (deep-to-superficial)
  format: ome-zarr
  input: ./ome-zarr/skin_janelia_flip.ome.zarr
  requirements:
  - R7
  - R9
  expect: valid
  rationale: exact flip of TC-24; covers deep-to-superficial.
  expected:
    rfc4_valid: true
    axes:
      z: deep-to-superficial
    violations: []
- id: TC-42
  title: Heart EM, flipped (base-to-apex)
  format: ome-zarr
  input: ./ome-zarr/heart_janelia_flip.ome.zarr
  requirements:
  - R7
  - R9
  expect: valid
  rationale: exact flip of TC-25; covers base-to-apex.
  expected:
    rfc4_valid: true
    axes:
      z: base-to-apex
    violations: []
- id: TC-45
  title: Airway epithelium, flipped (basal-to-apical)
  format: ome-zarr
  input: ./ome-zarr/airway_epithelium_flip.ome.zarr
  requirements:
  - R7
  - R9
  expect: valid
  rationale: exact flip of TC-44; covers basal-to-apical on real data.
  expected:
    rfc4_valid: true
    axes:
      z: basal-to-apical
    violations: []
- id: TC-47
  title: Whole-body mouse, flipped (cranial-to-caudal)
  format: ome-zarr
  input: ./ome-zarr/mouse_rosenhain_flip.ome.zarr
  requirements:
  - R7
  - R9
  expect: valid
  rationale: exact flip of TC-46; covers cranial-to-caudal on real data.
  expected:
    rfc4_valid: true
    axes:
      z: cranial-to-caudal
      y: dorsal-to-ventral
    violations: []
- id: VC-1
  title: Hand phantom (dorsal-to-palmar, synthetic)
  format: ome-zarr
  input: ./ome-zarr/vocab-quad-limb.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: palmar/dorsal are the only 2 of 24 terms with no defensible open real dataset (verified negative);
    recognizable synthetic phantom.
  expected:
    rfc4_valid: true
    axes:
      z: cranial-to-caudal
      y: dorsal-to-palmar
      x: proximal-to-distal
    violations: []
- id: VC-2
  title: Hand phantom, flipped (palmar-to-dorsal)
  format: ome-zarr
  input: ./ome-zarr/vocab-quad-limb-flip.ome.zarr
  requirements:
  - R7
  - R9
  expect: valid
  rationale: exact flip of VC-1; covers caudal-to-cranial + palmar-to-dorsal + distal-to-proximal.
  expected:
    rfc4_valid: true
    axes:
      z: caudal-to-cranial
      y: palmar-to-dorsal
      x: distal-to-proximal
    violations: []
- id: SC-04
  title: Oblique NIfTI (30deg)
  format: nifti
  input: conformance/cases/SC-04_oblique_nifti.nii.gz
  requirements:
  - R8
  expect: valid
  rationale: axes 30deg off; a conformant tool SHOULD warn (roughly-aligned precondition).
  expected:
    warnings:
    - not-roughly-aligned
- id: TC-10
  title: Canon oblique DTI (dcm_qa_canon_61)
  format: nifti
  input: ./nifti/TC-10_canon_DTI_oblique_20d.nii.gz
  requirements:
  - R8
  - R10
  expect: valid
  rationale: real oblique DTI, ~20deg on all views (36deg off-axis); real-data counterpart to SC-04.
  expected:
    axes:
      i: right-to-left
      j: posterior-to-anterior
      k: inferior-to-superior
    warnings:
    - not-roughly-aligned
- id: TC-37
  title: Real CT, axial identity IOP
  format: dicom
  input: ./dicom/real_ct_small.dcm
  requirements:
  - R10
  expect: valid
  rationale: real acquired DICOM (vs synthetic TC-05/06); axial identity IOP; PatientPosition ignored.
  expected:
    axes:
      x: right-to-left
      y: anterior-to-posterior
      z: inferior-to-superior
- id: TC-48
  title: Real CT, oblique IOP (~22deg)
  format: dicom
  input: ./dicom/real_ct_oblique.dcm
  requirements:
  - R8
  - R10
  expect: valid
  rationale: real DICOM with non-identity oblique IOP (~22deg gantry tilt); SHOULD warn not-roughly-aligned.
  expected:
    axes:
      x: right-to-left
      y: anterior-to-posterior
      z: inferior-to-superior
    warnings:
    - not-roughly-aligned
