rfc4:
  version: 0.2.0
  spec: https://ngff.openmicroscopy.org/rfc/4
  pr: https://github.com/ome/ngff/pull/528
canonical_output_contract:
  description: A conformant tool, given one input, emits this JSON.
  fields:
    input: path to the dataset
    format: ome-zarr | nifti | dicom | nrrd
    rfc4_valid: bool (ome-zarr schema cases only; null for derived formats)
    axes: list of {name, type, orientation-value|null}
    violations: list of {code, axis, message} (empty when valid)
    warnings: list of {code, message}
requirements:
  R1:
    level: MUST
    text: orientation only on axes with type 'space' (never time/channel)
  R2:
    level: MUST
    text: orientation is an object with both 'type' and 'value'
  R3:
    level: MUST
    text: orientation.type is 'anatomical'
  R4:
    level: MUST
    text: orientation.value is one of the 24 controlled-vocabulary terms
  R5:
    level: MUST
    text: at most one direction per anatomical axis (no antonym-pair collision)
  R6:
    level: SHOULD
    text: writers omit the field rather than serialize null (null == absent)
  R7:
    level: DEF
    text: value names the lowest->highest coordinate direction (flip semantics)
  R8:
    level: SHOULD
    text: subject roughly aligned to imaging axes (oblique -> warn)
  R9:
    level: COVER
    text: full vocabulary incl. subject-local (PR#528) and quadruped terms
  R10:
    level: DERIVE
    text: correct RFC-4 derivation from DICOM IOP / NIfTI affine / NRRD space directions
cases:
- id: TC-16
  title: Synthetic LPS baseline
  format: ome-zarr
  input: ./synthetic/ome-zarr/TC-16_synthetic_LPS.ome.zarr
  requirements:
  - R2
  - R3
  - R4
  - R7
  expect: valid
  rationale: 'Baseline: three standard terms written explicitly; establishes the LPS reference.'
  expected:
    rfc4_valid: true
    axes:
      z: inferior-to-superior
      y: anterior-to-posterior
      x: right-to-left
    violations: []
- id: TC-17
  title: Synthetic RAS baseline
  format: ome-zarr
  input: ./synthetic/ome-zarr/TC-17_synthetic_RAS.ome.zarr
  requirements:
  - R7
  expect: valid
  rationale: 'Flip pair of TC-16: x and y invert; proves the lowest->highest coordinate convention.'
  expected:
    rfc4_valid: true
    axes:
      z: inferior-to-superior
      y: posterior-to-anterior
      x: left-to-right
    violations: []
- id: TC-18
  title: Skin superficial-to-deep
  format: ome-zarr
  input: ./synthetic/ome-zarr/TC-18_skin_superficial_deep.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: PR#528 subject-local layered-tissue term (distinct from TC-19/TC-20).
  expected:
    rfc4_valid: true
    axes:
      z: superficial-to-deep
    violations: []
- id: TC-19
  title: Epithelial apical-to-basal
  format: ome-zarr
  input: ./synthetic/ome-zarr/TC-19_epithelial_apical_basal.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: PR#528 epithelial polarity term (distinct term).
  expected:
    rfc4_valid: true
    axes:
      z: apical-to-basal
    violations: []
- id: TC-20
  title: Cardiac apex-to-base
  format: ome-zarr
  input: ./synthetic/ome-zarr/TC-20_cardiac_apex_base.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: PR#528 cardiac term (distinct term).
  expected:
    rfc4_valid: true
    axes:
      z: apex-to-base
    violations: []
- id: TC-C
  title: Invalid vocabulary 'LPS'
  format: ome-zarr
  input: ./ome-zarr/TC-C_invalid_vocabulary.zip
  requirements:
  - R4
  expect: invalid
  rationale: '''LPS'' shorthand is not a vocabulary term; MUST be rejected.'
  expected:
    rfc4_valid: false
    violations:
    - bad-value
- id: TC-D
  title: Orientation on time axis
  format: ome-zarr
  input: ./ome-zarr/TC-D_orientation_on_time_axis.zip
  requirements:
  - R1
  expect: invalid
  rationale: orientation on a type:time axis is forbidden; MUST be rejected.
  expected:
    rfc4_valid: false
    violations:
    - orientation-on-non-space
- id: SC-03
  title: Orientation on channel axis
  format: ome-zarr
  input: conformance/cases/SC-03_channel_orientation.ome.zarr
  requirements:
  - R1
  expect: invalid
  rationale: type:channel variant of the non-space rule; isolates the single violation.
  expected:
    rfc4_valid: false
    violations:
    - orientation-on-non-space
- id: SC-05
  title: Missing orientation value
  format: ome-zarr
  input: conformance/cases/SC-05_missing_value.ome.zarr
  requirements:
  - R2
  expect: invalid
  rationale: orientation without 'value' violates the required-fields rule.
  expected:
    rfc4_valid: false
    violations:
    - missing-value
- id: SC-06
  title: Bad orientation type
  format: ome-zarr
  input: conformance/cases/SC-06_bad_type.ome.zarr
  requirements:
  - R3
  expect: invalid
  rationale: orientation.type 'geographical' is not 'anatomical'.
  expected:
    rfc4_valid: false
    violations:
    - bad-type
- id: SC-07
  title: Duplicate anatomical axis
  format: ome-zarr
  input: conformance/cases/SC-07_duplicate_pair.ome.zarr
  requirements:
  - R5
  expect: invalid
  rationale: two axes on the left-to-right/right-to-left axis; only one allowed.
  expected:
    rfc4_valid: false
    violations:
    - duplicate-anatomical-axis
- id: SC-01
  title: Quadruped vocabulary
  format: ome-zarr
  input: conformance/cases/SC-01_quadruped_valid.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: quadruped terms (dorsal-to-ventral, rostral-to-caudal) MUST be accepted.
  expected:
    rfc4_valid: true
    axes:
      z: dorsal-to-ventral
      y: rostral-to-caudal
      x: left-to-right
    violations: []
- id: SC-02
  title: Null orientation
  format: ome-zarr
  input: conformance/cases/SC-02_null_orientation.ome.zarr
  requirements:
  - R6
  expect: valid
  rationale: orientation:null == absent; valid, but a SHOULD-omit warning is emitted.
  expected:
    rfc4_valid: true
    warnings:
    - null-orientation
    violations: []
- id: TC-05
  title: DICOM HFDR
  format: dicom
  input: ./dicom/TC-05_HFDR.dcm
  requirements:
  - R10
  expect: valid
  rationale: derive orientation from IOP=[0,-1,0,1,0,0]; PatientPosition ignored.
  expected:
    axes:
      x: posterior-to-anterior
      y: right-to-left
      z: inferior-to-superior
- id: TC-06
  title: DICOM HFDL
  format: dicom
  input: ./dicom/TC-06_HFDL.dcm
  requirements:
  - R10
  - R7
  expect: valid
  rationale: mirror of TC-05 (L/R flip in the IOP derivation).
  expected:
    axes:
      x: anterior-to-posterior
      y: left-to-right
      z: inferior-to-superior
- id: TC-11
  title: NIfTI qform!=sform
  format: nifti
  input: ./nifti/TC-11_qform_sform_mismatch.nii.gz
  requirements:
  - R10
  expect: valid
  rationale: qform/sform ambiguity; a tool must document which transform it uses.
  expected:
    axes:
      i: right-to-left
      j: posterior-to-anterior
      k: inferior-to-superior
- id: TC-08
  title: MNI avg152 LR (LAS)
  format: nifti
  input: ./nifti/avg152T1_LR_nifti.nii.gz
  requirements:
  - R10
  - R7
  expect: valid
  rationale: real reference; neurological LAS. Flip pair with TC-09.
  expected:
    axes:
      i: right-to-left
      j: posterior-to-anterior
      k: inferior-to-superior
- id: TC-09
  title: MNI avg152 RL (RAS)
  format: nifti
  input: ./nifti/avg152T1_RL_nifti.nii.gz
  requirements:
  - R10
  - R7
  expect: valid
  rationale: real reference; radiological RAS. Proves L/R flip detection vs TC-08.
  expected:
    axes:
      i: left-to-right
      j: posterior-to-anterior
      k: inferior-to-superior
- id: TC-23
  title: Canon axial DTI (dcm_qa_canon_61)
  format: nifti
  input: ./nifti/TC-23_canon_DTI_axial.nii.gz
  requirements:
  - R10
  expect: valid
  rationale: real Canon 3T DTI, axial strict (0deg off-axis); clean LAS derivation (BSD-2).
  expected:
    axes:
      i: right-to-left
      j: posterior-to-anterior
      k: inferior-to-superior
- id: TC-13
  title: NRRD MRHead (LPS rotated)
  format: nrrd
  input: ./nrrd/MRHead.nrrd
  requirements:
  - R10
  - R8
  expect: valid
  rationale: real NRRD, LPS with non-identity space directions; stresses dominant-axis derivation.
  expected:
    axes:
      '0': anterior-to-posterior
      '1': superior-to-inferior
      '2': left-to-right
- id: TC-21
  title: Real Allen mouse (quadruped)
  format: ome-zarr
  input: ./real/ome-zarr/mouse_allen_quadruped.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real mouse brain; quadruped terms written into OME-Zarr (from atlas 'asr').
  expected:
    rfc4_valid: true
    axes:
      z: rostral-to-caudal
      y: dorsal-to-ventral
      x: right-to-left
    violations: []
- id: TC-22
  title: Real foot CT (limb)
  format: ome-zarr
  input: ./real/ome-zarr/foot_cmb_limb.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real foot; limb terms written into OME-Zarr; proximal-distal verified by bone mass.
  expected:
    rfc4_valid: true
    axes:
      z: distal-to-proximal
      y: dorsal-to-plantar
    violations: []
- id: TC-24
  title: Real skin superficial-to-deep (Janelia)
  format: ome-zarr
  input: ./real/ome-zarr/skin_janelia_superficial_deep.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real mouse skin FIB-SEM (jrc_mus-skin-1, CC BY 4.0); subject-local depth term on real data.
  expected:
    rfc4_valid: true
    axes:
      z: superficial-to-deep
    violations: []
- id: TC-25
  title: Real heart apex-to-base (Janelia)
  format: ome-zarr
  input: ./real/ome-zarr/heart_janelia_apex_base.ome.zarr
  requirements:
  - R9
  expect: valid
  rationale: real mouse heart FIB-SEM (jrc_mus-heart-1, CC BY 4.0); subject-local cardiac term on real
    data.
  expected:
    rfc4_valid: true
    axes:
      z: apex-to-base
    violations: []
- id: SC-04
  title: Oblique NIfTI (30deg)
  format: nifti
  input: conformance/cases/SC-04_oblique_nifti.nii.gz
  requirements:
  - R8
  expect: valid
  rationale: axes 30deg off; a conformant tool SHOULD warn (roughly-aligned precondition).
  expected:
    warnings:
    - not-roughly-aligned
- id: TC-10
  title: Canon oblique DTI (dcm_qa_canon_61)
  format: nifti
  input: ./nifti/TC-10_canon_DTI_oblique_20d.nii.gz
  requirements:
  - R8
  - R10
  expect: valid
  rationale: real oblique DTI, ~20deg on all views (36deg off-axis); real-data counterpart to SC-04.
  expected:
    axes:
      i: right-to-left
      j: posterior-to-anterior
      k: inferior-to-superior
    warnings:
    - not-roughly-aligned
